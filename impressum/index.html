<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Google's favicon crawler wants a square icon that is a multiple of 48px;
		     favicon.ico only carries 16 and 32. -->
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b1428" />
		<meta name="color-scheme" content="dark light" />
		<!-- Colour theme. Dark (ink) is the default and needs no attribute; a
		     visitor who chose light gets data-theme="light" before first paint.
		     The click handler is delegated so the toggle works on the pages that
		     ship no JavaScript bundle. The choice lives in localStorage, on the
		     visitor's own click only — the Datenschutzerklärung says so. -->
		<script>
			(function () {
				var d = document.documentElement;
				var t = null;
				try { t = localStorage.getItem('theme'); } catch (e) {}
				if (t === 'light') d.setAttribute('data-theme', 'light');
				document.addEventListener('click', function (e) {
					if (!e.target.closest('[data-theme-toggle]')) return;
					var light = d.getAttribute('data-theme') !== 'light';
					if (light) d.setAttribute('data-theme', 'light'); else d.removeAttribute('data-theme');
					try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', light ? '#12264a' : '#0b1428');
				});
			})();
		</script>
