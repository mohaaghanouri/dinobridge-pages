<!doctype html>
<!-- Served by GitHub Pages for any path that doesn't exist. Self-contained on
     purpose: the app's font and CSS files carry hashed names, so this page can
     reference neither. It therefore repeats the palette from src/styles/global.css
     by hand and falls back to the same system fonts the token stack names.
     If the tokens there change, change them here too — there is no import that
     would do it for you, and this is the one page nobody thinks to open. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>404 — Dinobridge</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#221a13" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- The same read Base.astro does, so a visitor who chose the sand theme is
		     not flash-banged by an espresso page on the one page that means
		     something went wrong. No write: there is no toggle here to write from. -->
		<script>
			(function () {
				try {
					if (localStorage.getItem('theme') === 'light')
						document.documentElement.setAttribute('data-theme', 'light');
				} catch (e) {}
			})();
		</script>
		<style>
			:root {
				--espresso: #221a13;
				--sand: #ece1cf;
				--terracotta: #bc5a38;

				--bg: var(--espresso);
				--text: var(--sand);
				--muted: #c0b5a4;
				--faint: #a89b8b;
				--line: rgb(236 225 207 / 0.11);
				--line-strong: rgb(236 225 207 / 0.28);
				--hover: #2c231a;

				--serif: Georgia, 'Times New Roman', serif;
				--sans: system-ui, -apple-system, Arial, sans-serif;

				color-scheme: dark;
			}

			:root[data-theme='light'] {
				--bg: var(--sand);
				--text: var(--espresso);
				--muted: #5a4c40;
				--faint: #6e6055;
				--line: rgb(34 26 19 / 0.13);
				--line-strong: rgb(34 26 19 / 0.3);
				--hover: #f7efe2;
				color-scheme: light;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: 1.0625rem;
				line-height: 1.6;
			}

			main {
				max-width: 38rem;
				padding: 2rem clamp(1.25rem, 4vw, 4rem);
			}

			/* Same content-swap global.css uses, so the mark follows the chosen
			   theme rather than the OS preference. */
			.logo {
				display: block;
				height: 2rem;
				width: auto;
				margin-bottom: 2.5rem;
				content: url('/brand/dinobridge-mark-icon-white.svg');
			}

			:root[data-theme='light'] .logo {
				content: url('/brand/dinobridge-mark-icon.svg');
			}

			.meta {
				font-size: 0.8125rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 0;
			}

			h1 {
				font-family: var(--serif);
				font-weight: 400;
				letter-spacing: -0.01em;
				line-height: 1.08;
				font-size: clamp(2.5rem, 1.6rem + 4.4vw, 4rem);
				margin: 0.5rem 0 1.25rem;
			}

			p {
				color: var(--muted);
				max-width: 34rem;
				margin: 0 0 0.5rem;
			}

			p[lang='de'] {
				color: var(--faint);
				margin-bottom: 2.5rem;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
			}

			nav a {
				display: inline-flex;
				align-items: center;
				font-size: 0.9375rem;
				font-weight: 500;
				line-height: 1.2;
				padding: 0.9rem 1.35rem;
				border: 1px solid var(--line-strong);
				border-radius: 7px;
				color: var(--text);
				text-decoration: none;
			}

			nav a:hover {
				background: var(--hover);
			}

			/* Terracotta is a fill and never small text, here as on every other
			   page, and the text on it is pure white: sand on terracotta is
			   3.90:1 and fails AA, white is 4.51:1 and passes. */
			nav a.primary {
				background: var(--terracotta);
				border-color: var(--terracotta);
				color: #ffffff;
			}

			nav a.primary:hover {
				background: #a94d2e;
				border-color: #a94d2e;
			}
		</style>
	</head>
	<body>
		<main>
			<a href="/">
				<img class="logo" src="/brand/dinobridge-mark-icon-white.svg" alt="Dinobridge" height="32" />
			</a>
			<p class="meta">404</p>
			<h1>This page does not exist.</h1>
			<p>The address may have changed, or it never was. Everything real is one click away.</p>
			<p lang="de">Diese Seite gibt es nicht. Alles Echte ist einen Klick entfernt.</p>
			<nav>
				<a class="primary" href="/">Home</a>
				<a href="/work/">Examples</a>
				<a href="/de/" lang="de">Deutsch</a>
			</nav>
		</main>
	</body>
</html>
