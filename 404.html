<!doctype html>
<!-- Served by GitHub Pages for any path that doesn't exist. Self-contained on
     purpose: the app's font and CSS files carry hashed names, so this page can
     reference neither. It therefore repeats the palette from src/app.css by
     hand and falls back to the same system fonts the token stack names.
     If the tokens in app.css change, change them here too — there is no import
     that would do it for you, and this is the one page nobody thinks to open. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>404 — Dinobridge</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#0b1428" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- The same read app.html does, so a visitor who chose the paper theme is
		     not flash-banged by a navy page on the one page that means something
		     went wrong. No write: there is no toggle here to write from. -->
		<script>
			(function () {
				try {
					if (localStorage.getItem('theme') === 'light')
						document.documentElement.setAttribute('data-theme', 'light');
				} catch (e) {}
			})();
		</script>
		<style>
			:root {
				--navy: #12264a;
				--paper: #f5f6f9;
				--amber: #e4a62b;

				--bg: #0b1428;
				--text: var(--paper);
				--muted: rgb(245 246 249 / 0.78);
				--faint: rgb(245 246 249 / 0.62);
				--line: rgb(245 246 249 / 0.16);
				--line-strong: rgb(245 246 249 / 0.34);
				--hover: #1b376a;

				--serif: Georgia, 'Times New Roman', serif;
				--sans: system-ui, -apple-system, Arial, sans-serif;

				color-scheme: dark;
			}

			:root[data-theme='light'] {
				--bg: var(--paper);
				--text: var(--navy);
				--muted: #4b5670;
				--faint: rgb(18 38 74 / 0.6);
				--line: rgb(18 38 74 / 0.14);
				--line-strong: rgb(18 38 74 / 0.3);
				--hover: #eceff5;
				color-scheme: light;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: 1.0625rem;
				line-height: 1.6;
			}

			main {
				max-width: 38rem;
				padding: 2rem clamp(1.25rem, 4vw, 4rem);
			}

			/* Same content-swap app.css uses, so the mark follows the chosen
			   theme rather than the OS preference. */
			.logo {
				display: block;
				height: 2rem;
				width: auto;
				margin-bottom: 2.5rem;
				content: url('/brand/dinobridge-mark-icon-white.svg');
			}

			:root[data-theme='light'] .logo {
				content: url('/brand/dinobridge-mark-icon.svg');
			}

			.meta {
				font-size: 0.8125rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 0;
			}

			h1 {
				font-family: var(--serif);
				font-weight: 400;
				letter-spacing: -0.01em;
				line-height: 1.08;
				font-size: clamp(2.5rem, 1.6rem + 4.4vw, 4rem);
				margin: 0.5rem 0 1.25rem;
			}

			p {
				color: var(--muted);
				max-width: 34rem;
				margin: 0 0 0.5rem;
			}

			p[lang='de'] {
				color: var(--faint);
				margin-bottom: 2.5rem;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
			}

			nav a {
				display: inline-flex;
				align-items: center;
				font-size: 0.9375rem;
				font-weight: 500;
				line-height: 1.2;
				padding: 0.9rem 1.35rem;
				border: 1px solid var(--line-strong);
				border-radius: 6px;
				color: var(--text);
				text-decoration: none;
			}

			nav a:hover {
				background: var(--hover);
			}

			/* Amber is spent on exactly one thing, here as on every other page:
			   the filled button, always with navy text on it. */
			nav a.primary {
				background: var(--amber);
				border-color: var(--amber);
				color: var(--navy);
			}

			nav a.primary:hover {
				background: #c8901f;
				border-color: #c8901f;
			}
		</style>
	</head>
	<body>
		<main>
			<a href="/">
				<img class="logo" src="/brand/dinobridge-mark-icon-white.svg" alt="Dinobridge" height="32" />
			</a>
			<p class="meta">404</p>
			<h1>This page does not exist.</h1>
			<p>The address may have changed, or it never was. Everything real is one click away.</p>
			<p lang="de">Diese Seite gibt es nicht. Alles Echte ist einen Klick entfernt.</p>
			<nav>
				<a class="primary" href="/">Home</a>
				<a href="/work/">Examples</a>
				<a href="/de/" lang="de">Deutsch</a>
			</nav>
		</main>
	</body>
</html>
